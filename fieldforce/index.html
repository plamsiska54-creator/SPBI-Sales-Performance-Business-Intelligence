<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบริหารทีมงานนอกสถานที่ — Work Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --red:#c1121f; --red2:#9d0d18; --gold:#c9a227;
    --nav-w:198px; --emp-w:236px;
    --line:#dfe3e8; --line2:#eceef1;
    --txt:#2c3239; --txt2:#6b7684; --txt3:#9aa4b0;
    --done:#d9ead3; --done-b:#b7d7ab; --done-t:#1e5c2e;
    --plan:#ffffff; --plan-b:#c8ced6; --plan-t:#3d4650;
    --wait:#ffd966; --wait-b:#e6bd35; --wait-t:#5c4708;
    --leave:#f2a3a3; --leave-b:#e08484; --leave-t:#6d1414;
    --off:#e9ebee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--txt);
    background:#f5f6f8;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

  /* ================= HEADER ================= */
  header{height:70px;flex:0 0 70px;background:linear-gradient(90deg,var(--red2),var(--red) 34%,var(--red2));
    display:flex;align-items:center;padding:0 22px 0 16px;color:#fff;position:relative;overflow:hidden;z-index:60}
  header::after{content:'';position:absolute;left:36%;top:-20px;width:230px;height:130px;
    background:linear-gradient(100deg,#fff 0 46%,var(--gold) 46% 62%,#7d0910 62%);
    transform:skewX(-24deg);opacity:.92}
  .logo{display:flex;align-items:center;gap:11px;z-index:2}
  .logo-mk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--gold);
    display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--gold);
    background:rgba(0,0,0,.16);letter-spacing:-1px}
  .logo b{font-size:23px;letter-spacing:1.4px;font-weight:700}
  .h-right{margin-left:auto;display:flex;align-items:center;gap:15px;z-index:2}
  .h-co{font-size:14.5px;font-weight:500}
  .h-av{width:41px;height:41px;border-radius:50%;background:#8f8f8f;display:grid;place-items:center;
    font-size:14px;font-weight:600;letter-spacing:.5px}
  .h-user{font-size:13px}
  .h-ico{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;cursor:pointer;
    font-size:17px;opacity:.92}
  .h-ico:hover{background:rgba(0,0,0,.18)}

  /* ================= SHELL ================= */
  .shell{flex:1;display:flex;min-height:0}

  /* --- left nav --- */
  nav{width:var(--nav-w);flex:0 0 var(--nav-w);background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .nav-scroll{flex:1;overflow-y:auto}
  .nav-scroll::-webkit-scrollbar{width:7px}
  .nav-scroll::-webkit-scrollbar-thumb{background:#cfd5dc;border-radius:4px}
  .grp{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 6px;
    font-size:11.5px;font-weight:600;letter-spacing:.7px;color:#5a6470;cursor:pointer;
    border-bottom:1px solid var(--line2)}
  .grp:hover{background:#fafbfc}
  /* กลุ่มที่กางอยู่มีเส้นขีดใต้ชื่อกลุ่ม */
  .grp .t{flex:1;padding-bottom:7px;border-bottom:2px solid #5c1a1d}
  .grp.closed .t{border-bottom-color:transparent}
  .grp .car{font-size:10px;color:var(--txt3);transition:.2s;padding-top:1px}
  .grp.closed .car{transform:rotate(180deg)}
  .grp-items{overflow:hidden;transition:max-height .22s}
  .grp.closed + .grp-items{max-height:0!important}
  .ni{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer;font-size:13px;
    color:#3f4854;border-bottom:1px solid var(--line2)}
  .ni:hover{background:#f6f7f9}
  .ni .ic{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;font-size:14px;
    color:#8b95a1;border-radius:4px}
  .ni.on{background:#fdf3f3;color:var(--red2);font-weight:500}
  .ni.on .ic{background:var(--red);color:#fff}
  .nav-foot{border-top:1px solid var(--line);font-size:11px;color:var(--txt3)}
  .sup{display:flex;align-items:center;gap:9px;padding:12px 14px;background:#f0f1f3;
    cursor:pointer;font-size:12.5px;color:#5a6470}
  .ver{padding:9px 14px;display:flex;justify-content:space-between;align-items:center}

  /* --- employee column --- */
  .emp{width:var(--emp-w);flex:0 0 var(--emp-w);background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .emp-search{padding:10px}
  .emp-search div{position:relative}
  .emp-search input{width:100%;border:1px solid #c8ced6;border-radius:3px;padding:7px 30px 7px 10px;
    font-family:inherit;font-size:12.5px;outline:none;color:var(--txt)}
  .emp-search input:focus{border-color:var(--red)}
  .emp-search .si{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#8b95a1;font-size:13px}
  .emp-list{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
  .emp-list::-webkit-scrollbar{width:7px}
  .emp-list::-webkit-scrollbar-thumb{background:#cfd5dc;border-radius:4px}
  .ec{display:flex;gap:10px;padding:11px 10px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .ec:hover{background:#fafbfc}
  .ec.on{background:#eef0f3}
  .ec.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .ec-av{width:40px;height:40px;flex:0 0 40px;border-radius:4px;background:#d8dce1;
    display:grid;place-items:center;font-size:15px;font-weight:600;color:#5a6470;overflow:hidden}
  .ec-b{flex:1;min-width:0}
  .ec-n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec-r{font-size:11px;color:var(--txt3);margin-bottom:5px}
  .ec-c{display:flex;align-items:center;gap:3px;flex-wrap:nowrap}
  .ec-all{font-size:11.5px;color:#4a545f;margin-right:2px;white-space:nowrap}
  .bdg{min-width:26px;text-align:center;padding:1px 4px;border-radius:2px;font-size:11px;font-weight:500}
  .bdg.g{background:var(--done);border:1px solid var(--done-b);color:var(--done-t)}
  .bdg.y{background:var(--wait);border:1px solid var(--wait-b);color:var(--wait-t)}
  .bdg.w{background:#e9ebee;border:1px solid #d3d7dd;color:#5a6470}

  /* --- main --- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .bar{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 14px;gap:10px;
    border-bottom:1px solid var(--line)}
  .bar h2{font-size:17px;font-weight:600;color:#3f4854}
  .views{margin-left:auto;display:flex;align-items:center;gap:3px}
  .vb{padding:8px 15px;font-size:14px;color:#5a6470;cursor:pointer;border:1px solid transparent;border-radius:3px}
  .vb:hover{color:var(--txt)}
  .vb.on{border-color:#b9c0c9;background:#fff;font-weight:600;color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nb{width:30px;height:30px;display:grid;place-items:center;border-radius:3px;cursor:pointer;
    color:#5a6470;font-size:16px}
  .nb:hover{background:#f0f1f3}
  .today-b{padding:6px 12px;border:1px solid #c8ced6;border-radius:3px;background:#fff;
    font-family:inherit;font-size:12.5px;cursor:pointer;color:#4a545f}
  .today-b:hover{border-color:var(--red);color:var(--red)}

  .canvas{flex:1;overflow:auto;background:#fff;position:relative}
  .canvas::-webkit-scrollbar{width:9px;height:9px}
  .canvas::-webkit-scrollbar-thumb{background:#cfd5dc;border-radius:5px}

  /* --- calendar grid --- */
  table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
  table.cal th{background:#fff;font-size:12px;font-weight:600;color:#6b7684;padding:6px 0 8px;
    border-bottom:1px solid var(--line)}
  table.cal td{border:1px solid var(--line);vertical-align:top;padding:0;height:118px;
    background:#fff;position:relative}
  td.off{background:var(--off)}
  td.blank{background:#fafbfc}
  td.today{box-shadow:inset 0 0 0 2px var(--red)}
  .dnum{position:absolute;top:3px;right:6px;font-size:12.5px;color:#5a6470;font-weight:500}
  td.today .dnum{color:var(--red);font-weight:700}
  .cell{padding:3px 3px 6px;display:flex;flex-direction:column;gap:2px;min-height:100%}

  /* เผื่อที่ให้เลขวันที่เฉพาะบรรทัดแรก — บรรทัดถัดไปใช้ความกว้างเต็ม */
  .pill{border-radius:2px;padding:3px 6px;font-size:11.5px;line-height:1.35;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;
    width:100%}
  .cell > .pill:first-child{width:calc(100% - 24px)}
  .pill:hover{filter:brightness(.95);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .pill.done {background:var(--done); border-color:var(--done-b); color:var(--done-t)}
  .pill.plan {background:var(--plan); border-color:var(--plan-b); color:var(--plan-t)}
  .pill.wait {background:var(--wait); border-color:var(--wait-b); color:var(--wait-t)}
  .pill.leave{background:var(--leave);border-color:var(--leave-b);color:var(--leave-t)}
  .pill.hol  {background:transparent;border:none;color:var(--red);cursor:default;font-weight:500}
  .pill.offlbl{background:transparent;border:none;color:#6b7684;cursor:default;padding-left:2px}
  .pill .t{font-weight:600;margin-right:5px}

  /* --- list / week / day views --- */
  .lv{padding:0}
  .lv-row{display:flex;border-bottom:1px solid var(--line2)}
  .lv-d{width:132px;flex:0 0 132px;padding:10px 12px;background:#fafbfc;border-right:1px solid var(--line2);
    font-size:12.5px}
  .lv-d b{display:block;font-size:15px}
  .lv-d span{color:var(--txt3);font-size:11.5px}
  .lv-d.offd b{color:#8b95a1}
  .lv-e{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
  .lv-e .pill{width:auto;max-width:520px;white-space:normal}
  .lv-empty{color:var(--txt3);font-size:12px;padding:3px 0}

  .wk{display:grid;grid-template-columns:repeat(7,1fr);min-width:820px}
  .wk-h{padding:8px 6px;border:1px solid var(--line);border-bottom:none;background:#fafbfc;
    font-size:12px;font-weight:600;color:#5a6470;text-align:center}
  .wk-h.offd{background:var(--off)}
  .wk-c{border:1px solid var(--line);min-height:340px;padding:5px;display:flex;flex-direction:column;gap:3px}
  .wk-c.offd{background:var(--off)}
  .wk-c .pill{width:100%;white-space:normal}

  .dayv{padding:16px 20px;max-width:760px}
  .dayv h3{font-size:19px;margin-bottom:3px}
  .dayv .sub{color:var(--txt2);font-size:12.5px;margin-bottom:16px}
  .dv-item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:4px;
    margin-bottom:8px;cursor:pointer;background:#fff}
  .dv-item:hover{border-color:#b9c0c9;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .dv-bar{width:4px;border-radius:2px;flex:0 0 4px}
  .dv-b b{display:block;font-size:13.5px;margin-bottom:3px}
  .dv-b span{font-size:12px;color:var(--txt2)}

  /* --- legend --- */
  .legend{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--line);
    background:#fafbfc;font-size:11.5px;color:var(--txt2);flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
    vertical-align:-1px;border:1px solid}

  /* ================= DASHBOARD ================= */
  .dash{background:#fff;min-height:100%}
  .dtab{border-bottom:1px solid var(--line);padding-left:16px}
  .dtab span{display:inline-block;padding:13px 20px;font-size:13px;letter-spacing:.9px;
    color:#4a545f;border-bottom:3px solid var(--red);font-weight:500}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:16px 18px 26px;align-items:start}
  .dcol{display:flex;flex-direction:column;gap:14px;min-width:0}

  .card{border:1px solid #e3e6ea;background:#fff}
  .card-h{background:linear-gradient(90deg,#e3111e 0%,#ee3d47 38%,#fff 100%);padding:9px 0}
  .card-h span{display:block;width:45%;text-align:center;color:#fff;font-weight:700;
    font-size:15px;letter-spacing:.6px}
  .card-b{padding:16px 18px 20px}

  .sec-t{font-size:15px;font-weight:500;color:#3f4854;border-bottom:1px solid #b9c0c9;
    display:inline-block;padding-bottom:2px;margin-bottom:14px}

  .today-g{display:grid;grid-template-columns:1fr 1.15fr;gap:22px}

  .mp-total{text-align:center;font-size:13.5px;color:#4a545f;margin-bottom:12px}
  .mp-total b{font-size:19px;margin:0 7px;color:#2c3239}
  .mp-line{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .mp-bar{flex:1;display:flex;align-items:center;padding:8px 13px;color:#fff;font-size:13px;border-radius:1px}
  .mp-bar b{margin-left:auto;font-size:16px;font-weight:600}
  .mp-bar i{margin-left:9px;font-style:normal;font-size:12.5px;opacity:.92}
  .mp-bar.g{background:#4c7a52} .mp-bar.w{background:#b6bac0} .mp-bar.r{background:#f2918f}
  .mp-ic{font-size:21px;line-height:1;width:22px;text-align:center}
  .mp-ic.g{color:#4c7a52} .mp-ic.w{color:#b6bac0} .mp-ic.r{color:#f2918f}

  .chart-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ch-legend{font-size:13px;line-height:2}
  .ch-legend .tt{color:#7b8794;margin-bottom:3px}
  .ch-legend div{white-space:nowrap}
  .ch-legend b{font-weight:600;margin-right:5px}

  .storage{border:1px solid #e3e6ea;display:flex;align-items:stretch;background:#fff}
  .st-l{background:#3a3f45;color:#fff;display:flex;align-items:center;gap:9px;padding:11px 14px;
    font-size:12px;line-height:1.3;flex:0 0 auto;border-left:4px solid var(--red)}
  .st-l .db{font-size:20px}
  .st-r{flex:1;padding:9px 14px;min-width:0}
  .st-top{display:flex;justify-content:space-between;font-size:12.5px;color:#4a545f;margin-bottom:6px}
  .st-track{height:17px;background:#fdeaea;position:relative}
  .st-fill{height:100%;background:#f2918f;display:flex;align-items:center;padding-left:7px;
    color:#7a1f1f;font-size:11.5px;font-weight:600;min-width:44px}

  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:6px 4px}
  .kpi-c{text-align:center}
  .kpi-c .kt{color:var(--red);font-size:13.5px;line-height:1.45}
  .kpi-c .ke{color:#8b95a1;font-size:12px;letter-spacing:.9px;margin-bottom:9px}
  .kpi-c .kv{font-size:35px;font-weight:400;padding:16px 4px;border:1px solid transparent;
    font-variant-numeric:tabular-nums;color:#2c3239}
  .kv.new{background:#f4837f} .kv.todo{background:#eceef0}
  .kv.doing{background:#fbe08a} .kv.cont{background:#a8dfa8}

  .per-sel{display:flex;justify-content:flex-end;padding:12px 18px 0}
  select.sel{font-family:inherit;font-size:12.5px;padding:6px 9px;border:1px solid #c8ced6;
    border-radius:2px;background:#fff;color:var(--txt);outline:none;cursor:pointer}
  select.sel:focus{border-color:var(--red)}

  .cmp-ctl{display:flex;align-items:center;justify-content:flex-end;gap:9px;font-size:12.5px;color:#4a545f}
  .cmp-h{font-size:16px;font-weight:500;color:#3f4854;margin:4px 0 2px}
  .cmp-lg{display:flex;justify-content:center;gap:20px;font-size:12.5px;color:#4a545f;margin-bottom:2px}
  .cmp-lg i{display:inline-block;width:26px;height:12px;margin-right:7px;vertical-align:-1px;border:1px solid}
  .cmp-wrap{overflow-x:auto}

  @media(max-width:1080px){ .dgrid{grid-template-columns:1fr} .today-g{grid-template-columns:1fr} }

  /* ================= WORK STAGE (Kanban) ================= */
  .stage{min-height:100%;background:#fff;display:flex;flex-direction:column}
  .sg-bar{display:flex;align-items:center;gap:22px;padding:12px 16px;border-bottom:1px solid var(--line);
    flex:0 0 auto;flex-wrap:wrap}
  .sg-q{position:relative;flex:0 0 250px}
  .sg-q input{width:100%;border:1px solid #c8ced6;border-radius:3px;padding:8px 32px 8px 11px;
    font-family:inherit;font-size:13px;outline:none;color:var(--txt)}
  .sg-q input:focus{border-color:var(--red)}
  .sg-q .si{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#8b95a1;font-size:13px}
  .sg-date{font-size:15px;color:#3f4854;white-space:nowrap}
  .sg-nb{width:26px;height:26px;display:grid;place-items:center;border-radius:3px;cursor:pointer;
    color:#5a6470;font-size:15px;user-select:none}
  .sg-nb:hover{background:#f0f1f3;color:var(--red)}
  .sg-today{padding:7px 17px;border:1px solid #c8ced6;border-radius:3px;background:#fff;
    font-family:inherit;font-size:13.5px;cursor:pointer;color:#3f4854}
  .sg-today:hover{border-color:var(--red);color:var(--red)}
  .sg-sum{font-size:19px;color:#5a6470;font-weight:400;white-space:nowrap}
  .sg-pct{font-size:19px;color:#4c9c56;font-weight:500}

  .sg-cols{flex:1;display:flex;gap:34px;padding:18px 20px 24px;align-items:flex-start;overflow-x:auto}
  .sg-col{flex:0 0 306px;display:flex;flex-direction:column;min-height:0}
  .sg-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-left:2px}
  .sg-h b{font-size:19px;font-weight:500;color:#4a545f;letter-spacing:.4px}
  .cnt{min-width:32px;height:32px;padding:0 8px;border-radius:50%;display:grid;place-items:center;
    font-size:14px;font-weight:600}
  .cnt.grey{background:#e4e6e9;color:#5a6470}
  .cnt.gold{background:#f0bc2c;color:#fff}
  .cnt.green{background:#54b35e;color:#fff}

  .sg-cards{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 260px);
    overflow-y:auto;padding-right:6px}
  .sg-cards::-webkit-scrollbar{width:9px}
  .sg-cards::-webkit-scrollbar-track{background:transparent}
  .sg-cards::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:5px}
  .sg-empty{color:var(--txt3);font-size:12.5px;padding:16px 4px;border:1px dashed var(--line);
    border-radius:3px;text-align:center}

  .jc{display:flex;background:#fff;border:1px solid #e6e9ec;border-radius:2px;
    box-shadow:0 1px 3px rgba(20,24,30,.07);cursor:pointer;overflow:hidden}
  .jc:hover{box-shadow:0 3px 9px rgba(20,24,30,.15)}
  .jc-bar{flex:0 0 9px}
  .jc.todo  .jc-bar{background:#b9bdc3}
  .jc.doing .jc-bar{background:#e8b21e}
  .jc.done  .jc-bar{background:#4caf50}
  .jc-b{flex:1;padding:11px 13px 10px;min-width:0;position:relative}
  .jc-i{position:absolute;top:9px;right:10px;width:17px;height:17px;border-radius:50%;
    background:#b9bdc3;color:#fff;font-size:11px;font-style:italic;font-weight:700;
    display:grid;place-items:center;line-height:1}
  .jc-i:hover{background:var(--red)}
  .jc-dt{font-size:14.5px;font-weight:600;color:#2c3239;padding-right:24px}
  .jc-ti{font-size:13.5px;color:#3f4854;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jc-cat{font-size:12px;color:#98a2ad;margin-top:1px}
  .jc-f{display:flex;align-items:center;gap:8px;margin-top:9px}
  .jc-team{background:#dff2e0;color:#357a3d;font-size:11.5px;padding:2px 8px;border-radius:2px}
  .jc-emp{margin-left:auto;font-size:12.5px;color:#4a545f;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .jc-av{flex:0 0 29px;width:29px;height:29px;border-radius:50%;background:#dfe3e7;
    display:grid;place-items:center;font-size:12px;color:#5a6470;font-weight:500}

  /* ================= LIST & SEARCH ================= */
  .ls{min-height:100%;background:#fff;display:flex;flex-direction:column}
  .ls-bar{padding:20px 16px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .ls-r1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

  .ls-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:12px}

    font-family:inherit;font-size:14px;outline:none;color:var(--txt)}
  .ls-srow input:focus{border-color:var(--red)}
  .more{color:#ef8b2c;font-size:14px;text-decoration:underline;cursor:pointer;white-space:nowrap}
  .more:hover{color:var(--red)}
  .exp{display:flex;gap:9px}
  .exp button{width:44px;height:36px;border:1px solid #c8ced6;border-radius:3px;background:#fff;
    cursor:pointer;font-size:17px;display:grid;place-items:center;padding:0;line-height:1}
  .exp button:hover{border-color:#8b95a1;background:#fafbfc}

  .ls-adv{display:none;gap:16px;margin-top:18px;flex-wrap:wrap}
  .ls-adv.on{display:flex}
  .ls-count{font-size:12.5px;color:var(--txt3);padding:9px 16px 0}

  .ls-wrap{flex:1;overflow:auto;min-height:0}
  .ls-wrap::-webkit-scrollbar{width:10px;height:10px}
  .ls-wrap::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:5px}
  table.ls-t{width:100%;min-width:1240px;border-collapse:collapse}
  .ls-t th{text-align:left;font-size:14px;font-weight:400;color:#5a6470;padding:15px 12px;
    border-bottom:1px solid #cfd4da;white-space:nowrap;background:#fff;position:sticky;top:0;z-index:2}
  .ls-t td{padding:11px 12px;border-bottom:1px solid #eef0f2;font-size:13.5px;
    vertical-align:middle;color:#3f4854}
  .ls-t tbody tr{cursor:pointer}
  .ls-t tbody tr:hover{background:#fafbfc}
  .stbar{display:block;width:56px;height:21px;border-radius:2px}
  .ls-emp{display:flex;align-items:center;gap:11px;white-space:nowrap}
  .ls-av{width:33px;height:33px;flex:0 0 33px;border-radius:50%;background:#dfe3e7;
    display:grid;place-items:center;font-size:12px;color:#5a6470;font-weight:500}
  .mono{font-family:'IBM Plex Sans Thai',ui-monospace,monospace;color:#4a545f}
  .ls-none{padding:44px;text-align:center;color:var(--txt3);font-size:13.5px}

  /* ================= GPS REALTIME ================= */
  .gp{position:absolute;inset:0;display:flex;min-height:0}
  .gp-side{width:296px;flex:0 0 296px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:500}
  .gp-ctl{padding:12px 12px 10px;display:flex;gap:10px;align-items:flex-start}
  .gp-ctl .gq{flex:1;min-width:0}
  .gp-ctl .gq input{width:100%;border:1px solid #c8ced6;border-radius:4px;padding:9px 11px;
    font-family:inherit;font-size:13px;outline:none;color:var(--txt)}
  .gp-ctl .gq input:focus{border-color:var(--red)}
  .gp-ctl .fld{min-width:0;flex:0 0 108px}
  .gp-ctl .fld select{font-size:13px;padding:9px 26px 9px 9px}
  .gp-ctl .fld > label{font-size:10px}

  .gp-clu{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 14px 10px;
    font-size:14px;color:#3f4854;cursor:pointer;user-select:none}
  .gp-clu i{width:18px;height:18px;border:2px solid #9aa4b0;border-radius:2px;display:grid;
    place-items:center;font-size:12px;color:transparent;line-height:1}
  .gp-clu.on i{background:#4c9c56;border-color:#4c9c56;color:#fff}

  .gp-list{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
  .gp-list::-webkit-scrollbar{width:8px}
  .gp-list::-webkit-scrollbar-thumb{background:#cfd5dc;border-radius:4px}
  .gu{display:flex;align-items:center;gap:11px;padding:13px 12px;border-bottom:1px solid var(--line);
    cursor:pointer;position:relative}
  .gu:hover{background:#fafbfc}
  .gu.on{background:#eef0f3}
  .gu.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .gu-av{width:41px;height:41px;flex:0 0 41px;border-radius:50%;background:#dfe3e7;
    display:grid;place-items:center;font-size:13px;color:#5a6470;font-weight:500;
    border:2px solid transparent}
  .gu-b{flex:1;min-width:0}
  .gu-n{font-size:13.5px;color:#2c3239;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gu-t{font-size:12.5px;color:#8b95a1;margin-top:2px}
  .gu-r{text-align:right;flex:0 0 auto}
  .gu-s{font-size:12.5px;color:#5a6470;white-space:nowrap}
  .gu-sp{font-size:12.5px;color:#5a6470;margin-top:2px;white-space:nowrap}

  .gp-map{flex:1;position:relative;min-width:0;background:#e8eaed}
  .gp-map .leaflet-container{position:absolute;inset:0;font-family:inherit;background:#e8eaed}
  .gp-map .leaflet-control-attribution{font-size:10px}

  .gp-tools{position:absolute;top:11px;right:11px;z-index:600;display:flex;flex-direction:column;
    align-items:flex-end;gap:9px}
  .gp-row{display:flex;gap:9px}
  .gp-box{background:#fff;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.3);
    font-size:13.5px;color:#3f4854;display:flex;align-items:center}
  .gp-tr{padding:9px 13px;gap:9px;cursor:pointer;user-select:none}
  .gp-tr i{width:15px;height:15px;border:2px solid #9aa4b0;border-radius:1px;display:grid;
    place-items:center;font-size:10px;color:transparent;line-height:1}
  .gp-tr.on i{background:#c1121f;border-color:#c1121f;color:#fff}
  .gp-fs{width:38px;height:38px;justify-content:center;cursor:pointer;font-size:15px;color:#5a6470}
  .gp-fs:hover{background:#f4f5f7}
  .gp-mt{padding:0}
  .gp-mt select{border:none;background:transparent;font-family:inherit;font-size:13.5px;
    padding:10px 28px 10px 13px;color:#3f4854;outline:none;cursor:pointer;appearance:none}
  .gp-mt{position:relative}
  .gp-mt::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);
    color:#7b8794;font-size:11px;pointer-events:none}

  /* หมุด */
  .gm{width:40px;height:40px}
  .gm-av{width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #4c9c56;
    box-shadow:0 2px 7px rgba(0,0,0,.4);display:grid;place-items:center;font-size:12px;
    font-weight:600;color:#3f4854}
  .gm.sel .gm-av{border-color:#c1121f;box-shadow:0 0 0 5px rgba(193,18,31,.28),0 2px 8px rgba(0,0,0,.4)}
  .gm-lbl{position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(255,255,255,.94);border-radius:3px;padding:1px 6px;font-size:11px;
    color:#3f4854;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .gc{width:52px;height:52px;border-radius:50%;background:rgba(108,117,125,.9);
    border:4px solid rgba(108,117,125,.45);display:grid;place-items:center;color:#fff;
    font-size:17px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}

  .gp-pop{min-width:196px}
  .gp-pop h4{font-size:13.5px;margin-bottom:7px;color:#2c3239}
  .gp-pr{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;padding:2.5px 0}
  .gp-pr span{color:#8b95a1}
  .gp-note{position:absolute;left:11px;bottom:34px;z-index:600;background:rgba(255,255,255,.94);
    border-left:3px solid var(--red);border-radius:2px;padding:7px 11px;font-size:11.5px;
    color:#5a6470;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:330px;line-height:1.5}

  /* ================= GPS PLAYBACK ================= */
  .pb{position:absolute;inset:0;display:flex;min-height:0}
  .pb-side{width:292px;flex:0 0 292px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:500}
  .pb-f{padding:13px 13px 0;display:flex;flex-direction:column;gap:15px}
  .pb-cb{position:relative;border:1px solid #c8ced6;border-radius:5px;display:flex;align-items:center;
    transition:border-color .15s}
  .pb-cb:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(193,18,31,.09)}
  .pb-cb select{flex:1;border:none;outline:none;background:transparent;font-family:inherit;
    font-size:14px;padding:11px 4px 11px 11px;color:var(--txt);appearance:none;cursor:pointer;
    min-width:0;text-overflow:ellipsis}
  .pb-cb .ic{padding:0 8px;color:#a3acb6;cursor:pointer;font-size:13px;line-height:1;user-select:none}
  .pb-cb .ic:hover{color:var(--red)}
  .pb-cb .dv{width:1px;height:19px;background:#e3e6ea}
  .pb-row{display:flex;gap:10px;align-items:stretch}
  .pb-row .fld{flex:1;min-width:0}
  .pb-side .fld{border-radius:5px;transition:border-color .15s}
  .pb-side .fld:focus-within{box-shadow:0 0 0 3px rgba(193,18,31,.09)}
  .pb-side .fld input{font-size:13.5px;padding:11px 9px}
  /* ช่องวันที่: โชว์ข้อความไทย dd/mm/yyyy ทับไว้ แต่ยังเรียกตัวเลือกวันที่ของเบราว์เซอร์ได้
     (input วันที่ของเบราว์เซอร์แสดงรูปแบบตาม locale เครื่อง ซึ่งอาจเป็น mm/dd/yyyy) */
  .fld.dt{position:relative;cursor:pointer}
  .fld.dt .dt-txt{display:block;padding:11px 32px 11px 10px;font-size:13.5px;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .fld.dt .dt-ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);
    color:#a3acb6;font-size:13px;pointer-events:none}
  .fld.dt:hover .dt-ic{color:var(--red)}
  .fld.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
    padding:0;border:none;margin:0}
  .clr{border:1px solid #e8b4b8;border-radius:5px;background:#fff;color:#c1121f;font-family:inherit;
    font-size:13px;letter-spacing:.7px;padding:0 15px;cursor:pointer;white-space:nowrap;
    font-weight:500;transition:.15s}
  .clr:hover{border-color:#c1121f;background:#c1121f;color:#fff}

  /* สรุประยะทาง */
  .pb-dist{margin-top:15px;padding:13px 15px;background:#f7f9f7;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:8px}
  .pb-dist .lb{font-size:12.5px;color:#7b8794;letter-spacing:.2px}

    font-variant-numeric:tabular-nums}
  .pb-dist i{font-style:normal;font-size:12.5px;color:#7b8794}

  /* ไทม์ไลน์เหตุการณ์ */
  .pb-ev{flex:1;overflow-y:auto;padding:8px 0 10px}
  .pb-ev::-webkit-scrollbar{width:8px}
  .pb-ev::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:4px}
  .pe{display:flex;gap:12px;padding:10px 14px 10px 15px;cursor:pointer;position:relative}
  .pe::after{content:'';position:absolute;left:26px;top:36px;bottom:-10px;width:2px;
    background:#e4e8ec;border-radius:1px}
  .pe:last-child::after{display:none}
  .pe:hover{background:#f8f9fb}
  .pe.on{background:#fdf4f4}
  .pe.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .pe-ic{flex:0 0 25px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;line-height:1;z-index:1;box-shadow:0 0 0 3px #fff}
  .pe.on .pe-ic{box-shadow:0 0 0 3px #fdf4f4}
  .pe-ic.k-in   {background:#fdf0d2;color:#b07a06}
  .pe-ic.k-start{background:#dfeafb;color:#1863ab}
  .pe-ic.k-visit{background:#fbe0e0;color:#b62525}
  .pe-ic.k-out  {background:#dcefdd;color:#2f7a38}
  .pe-b{flex:1;min-width:0;padding-top:1px}
  .pe-t{font-size:11.5px;color:#98a2ad;letter-spacing:.2px;margin-bottom:3px}
  .pe-l{font-size:13.5px;font-weight:600;color:#2c3239;line-height:1.4}
  .pe-v{font-size:12.5px;color:#5a6470;line-height:1.45;margin-top:2px;word-break:break-word}

  .pb-info{flex:0 0 auto;border-top:1px solid var(--line);padding:15px;text-align:center;
    font-size:13px;letter-spacing:1.1px;color:#b3bac2;cursor:default;user-select:none;background:#fff}
  .pb-info.on{color:#fff;cursor:pointer;font-weight:500;background:var(--red);letter-spacing:1.1px}
  .pb-info.on:hover{background:var(--red2)}

  .pb-map{flex:1;position:relative;min-width:0;background:#e8eaed}
  .pb-map .leaflet-container{position:absolute;inset:0;font-family:inherit;background:#e8eaed}

  .pb-play{position:absolute;left:14px;right:14px;bottom:14px;z-index:600;background:rgba(255,255,255,.96);
    border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.26);padding:9px 13px;
    display:flex;align-items:center;gap:13px}
  .pb-btn{width:33px;height:33px;flex:0 0 33px;border:none;border-radius:50%;background:#c1121f;

  .pb-btn:hover{background:#9d0d18}
  .pb-play input[type=range]{flex:1;min-width:0;accent-color:#c1121f;cursor:pointer}
  .pb-time{font-size:12.5px;color:#3f4854;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pb-sp{border:1px solid #c8ced6;border-radius:3px;background:#fff;font-family:inherit;
    font-size:12px;padding:5px 7px;color:#3f4854;cursor:pointer;outline:none}

  /* หมุดเหตุการณ์ */
  .pm{display:flex;align-items:flex-start;gap:4px;white-space:nowrap}
  .pm-pin{width:22px;height:30px;flex:0 0 22px;position:relative}
  .pm-pin::before{content:'';position:absolute;inset:0 0 6px 0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.45)}
  .pm-pin::after{content:'';position:absolute;left:50%;bottom:2px;margin-left:-3px;width:6px;height:9px;

  .pm-lb{background:rgba(255,255,255,.9);border-radius:2px;padding:1px 5px;font-size:11.5px;

  .pm.sel .pm-lb{background:#c1121f;color:#fff}

  .pb-empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:600;

    padding:12px 17px;font-size:13px;color:#5a6470;box-shadow:0 2px 10px rgba(0,0,0,.2);text-align:center}

  /* ================= WORK ORDER · CREATE ================= */
  .wo{min-height:100%;background:#fff;display:flex;flex-direction:column}
  .wo-tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;background:#fff}
  .wt{padding:14px 30px;font-size:13.5px;color:#5a6470;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap}
  .wt:hover{color:var(--txt)}
  .wt.on{color:#2c3239;border-bottom-color:#3f4854;font-weight:500}
  .wo-body{flex:1;overflow:auto;padding:20px}
  .wo-body::-webkit-scrollbar{width:10px;height:10px}
  .wo-body::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:5px}

  /* ซ้าย: นาฬิกา + ปุ่มสร้าง */

  .wo-left{flex:0 0 258px;text-align:center;padding-top:18px}
  .wo-date{font-size:23px;color:#3f4854;font-weight:500}

  .wo-mk.ready:hover{background:#e88585}

  /* การ์ดฟอร์ม */

  .wo-ch .x{cursor:pointer;color:#6b7684;font-size:19px;line-height:1}
  .wo-ch .x:hover{color:var(--red)}

  .wo-cb .fld textarea{width:100%;border:none;outline:none;font-family:inherit;resize:vertical;

  .wo-plain{border:1px solid #c8ced6;border-radius:4px;padding:11px 10px;font-family:inherit;

  /* checkbox / ปุ่มเล็ก */

    cursor:pointer;user-select:none}
  .wcb i{width:17px;height:17px;flex:0 0 17px;border:2px solid #9aa4b0;border-radius:2px;
    display:grid;place-items:center;font-size:11px;color:transparent;line-height:1}
  .wcb.on i{background:#f19b9b;border-color:#f19b9b;color:#fff}

/* ---------- ประเภทงาน ---------- */
const CATS = ['นำเสนอสินค้า','ตรวจสอบสต็อก','ส่งสินค้า','เก็บเงิน','อื่นๆ'];

/* ---------- สร้างข้อมูลของพนักงานคนอื่น (deterministic) ---------- */
function rnd(seed){ let x = Math.sin(seed)*10000; return x - Math.floor(x); }

function catFor(text, seed, i){
  if(text.includes('วรรณวนัช')) return 'นำเสนอสินค้า';
  const r = rnd(seed*7.3 + i*13.1);
  return r < .58 ? 'นำเสนอสินค้า' : CATS[1 + Math.floor(r*1000) % 4];
}

const SCHEDULE = {};   // SCHEDULE[empId]['YYYY-MM-DD'] = [{type,text,time}]

function key(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function buildSchedules(){
  EMPLOYEES.forEach((e,ei)=>{
    SCHEDULE[e.id] = {};
    // สร้าง 3 เดือน: ก.ค. / ส.ค. / ก.ย. 2026
    [6,7,8].forEach(m=>{
      const days = new Date(2026, m+1, 0).getDate();
      for(let d=1; d<=days; d++){
        const k = key(2026,m,d);
        const dow = new Date(2026,m,d).getDay();

        // E1 เดือน ส.ค. ใช้ข้อมูลจริงจากหน้าจอ
        if(ei===0 && m===7){
          if(E1_AUG[d]) SCHEDULE[e.id][k] = E1_AUG[d].map(([type,text,time],i)=>
            ({type, text, time, cat: type==='leave' ? null : catFor(text, d, i)}));
          continue;
        }
        if(HOLIDAYS[k]) continue;
        if(dow===DAY_OFF && rnd(ei*97+m*31+d) > .3) continue;

        const r = rnd(ei*13.7 + m*4.3 + d*1.9);
        if(r < .1) continue;                                   // วันว่าง
        const n = r < .45 ? 1 : (r < .85 ? 2 : 3);
        const past = new Date(2026,m,d) < TODAY;
        const list = [];
        if(r > .93) list.push({type:'leave', text:['ลาป่วย','ลากิจ','ไปทำธุระส่วนตัว','ทำงานในวันหยุด'][Math.floor(rnd(d*ei+m)*4)], time:'08:00-12:00'});
        for(let i=0;i<n;i++){
          const c = CUSTOMERS[Math.floor(rnd(ei*7+m*11+d*3+i*5)*CUSTOMERS.length)];
          let type = past ? 'done' : 'plan';
          if(past && rnd(d*3+i*7+ei) > .88) type = 'plan';      // ไม่ได้เช็คอิน
          if(!past && rnd(d*5+i*3+ei) > .93) type = 'wait';     // รออนุมัติ
          list.push({type, text:c, cat: catFor(c, d*3+ei*11+m, i)});
        }
        SCHEDULE[e.id][k] = list;
      }
    });
  });
}
buildSchedules();

/* ---------- นับสถิติต่อพนักงาน (ทั้ง 3 เดือน) ---------- */
function counts(empId){
  const c = {done:0, wait:0, plan:0, all:0};
  Object.values(SCHEDULE[empId]).forEach(list=> list.forEach(e=>{
    if(e.type==='leave') return;
    c[e.type]++; c.all++;
  }));
  return c;
}

/* --- มุมมองปฏิทิน --- */
function calHtml(){
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y,m,1).getDay();
  const days  = new Date(y,m+1,0).getDate();
  const cells = Math.ceil((first+days)/7)*7;

  let h = `<table class="cal"><thead><tr>${DOW_FULL.map((d,i)=>
    `<th${i===DAY_OFF?' style="background:var(--off)"':''}>${d}</th>`).join('')}</tr></thead><tbody><tr>`;

  for(let i=0;i<cells;i++){
    if(i && i%7===0) h += '</tr><tr>';
    const dnum = i - first + 1;
    if(dnum < 1 || dnum > days){ h += `<td class="blank"></td>`; continue; }

    const date = new Date(y,m,dnum);
    const k    = key(y,m,dnum);
    const dow  = date.getDay();
    const isOff= dow === DAY_OFF;
    const hol  = HOLIDAYS[k];
    const list = SCHEDULE[emp][k] || [];

    h += `<td class="${isOff?'off ':''}${sameDay(date,TODAY)?'today':''}">
      <div class="dnum">${dnum}</div>
      <div class="cell">
        ${isOff ? `<div class="pill offlbl">วันหยุดประจำสัปดาห์</div>` : ''}
        ${hol   ? `<div class="pill hol">${hol}</div>` : ''}
        ${list.map(e=>pillHtml(e,k)).join('')}
      </div></td>`;
  }
  return h + '</tr></tbody></table>';
}

/* --- มุมมองเดือน (รายการ) --- */
function listHtml(){
  const y = cur.getFullYear(), m = cur.getMonth();
  const days = new Date(y,m+1,0).getDate();
  let h = '<div class="lv">';
  for(let d=1; d<=days; d++){
    const date = new Date(y,m,d), k = key(y,m,d), dow = date.getDay();
    const isOff = dow===DAY_OFF, hol = HOLIDAYS[k];
    const list  = SCHEDULE[emp][k] || [];
    h += `<div class="lv-row">
      <div class="lv-d ${isOff?'offd':''}">
        <b>${d} ${MONTHS[m]}</b><span>วัน${DOW_FULL[dow]}${isOff?' · วันหยุด':''}</span>
      </div>
      <div class="lv-e">
        ${hol?`<div class="pill hol">${hol}</div>`:''}
        ${list.length ? list.map(e=>pillHtml(e,k)).join('')
                      : `<div class="lv-empty">${isOff?'วันหยุดประจำสัปดาห์':'— ไม่มีแผนงาน —'}</div>`}
      </div></div>`;
  }
  return h + '</div>';
}

/* --- มุมมองสัปดาห์ --- */
function weekHtml(){
  const base = new Date(curDay);
  base.setDate(base.getDate() - base.getDay());          // ย้อนไปวันอาทิตย์
  let heads='', cells='';
  for(let i=0;i<7;i++){
    const d = new Date(base); d.setDate(base.getDate()+i);
    const k = key(d.getFullYear(), d.getMonth(), d.getDate());
    const isOff = d.getDay()===DAY_OFF, hol = HOLIDAYS[k];
    const list = SCHEDULE[emp][k] || [];
    heads += `<div class="wk-h ${isOff?'offd':''}">${DOW_FULL[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</div>`;
    cells += `<div class="wk-c ${isOff?'offd':''}">
      ${hol?`<div class="pill hol">${hol}</div>`:''}
      ${list.map(e=>pillHtml(e,k)).join('')}</div>`;
  }
  return `<div class="wk">${heads}${cells}</div>`;
}

/* ---------- ตัววาดกราฟ SVG ---------- */
function svgDonut(segs, size){
  const total = segs.reduce((s,x)=>s+x.v, 0);
  const R = size/2 - 13, SW = 26, C = 2*Math.PI*R, cx = size/2;
  if(!total) return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cx}" r="${R}"
    fill="none" stroke="#e6e8eb" stroke-width="${SW}"/></svg>`;
  let off = 0, ring = '', labels = '';
  segs.filter(s=>s.v>0).forEach(s=>{
    const len = C*s.v/total;
    ring += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${SW}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cx})"/>`;
    const mid = (off + len/2)/C * 2*Math.PI - Math.PI/2;
    labels += `<text x="${(cx+R*Math.cos(mid)).toFixed(1)}" y="${(cx+R*Math.sin(mid)).toFixed(1)}"
      text-anchor="middle" dominant-baseline="central" font-size="11" fill="#fff" font-weight="600">${s.v}</text>`;
    off += len;
  });
  return `<svg width="${size}" height="${size}">${ring}${labels}</svg>`;
}

function svgPie(segs, size, labelMode){
  const total = segs.reduce((s,x)=>s+x.v, 0);
  const r = size/2, cx = r, cy = r;
  if(!total) return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#e6e8eb"/></svg>`;
  let a0 = -Math.PI/2, out = '';
  segs.filter(s=>s.v>0).forEach(s=>{
    const a1 = a0 + 2*Math.PI*s.v/total;
    if(s.v === total){
      out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.color}"/>`;
    }else{
      const large = (a1-a0) > Math.PI ? 1 : 0;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      out += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)}
        A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${s.color}"/>`;
    }
    const am = (a0+a1)/2, lx = cx + r*.62*Math.cos(am), ly = cy + r*.62*Math.sin(am);
    const txt = labelMode === 'pct' ? Math.round(s.v/total*100)+'%' : s.v;
    out += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
      font-size="12" font-weight="600" fill="${s.dark ? '#fff' : '#6b7280'}">${txt}</text>`;
    a0 = a1;
  });
  return `<svg width="${size}" height="${size}">${out}</svg>`;
}

function svgArea(seriesA, seriesB, labelA, labelB){
  const W=640, H=250, L=48, R=14, T=16, B=44;
  const n = Math.max(seriesA.length, seriesB.length);
  const peak = Math.max(1, ...seriesA, ...seriesB);
  const yMax = Math.max(5, Math.ceil((peak+1)/5)*5);   // เผื่อที่ว่างด้านบน ไม่ให้ยอดกราฟชนขอบ
  const px = i => L + (n<2 ? 0 : i*(W-L-R)/(n-1));
  const py = v => T + (1 - v/yMax)*(H-T-B);

  // เส้นแนวนอน + ป้ายแกน Y
  let grid = '';
  for(let v=0; v<=yMax; v+=5){
    grid += `<line x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}" stroke="#e6e8eb" stroke-width="1"/>
      <text x="${L-7}" y="${py(v)}" text-anchor="end" dominant-baseline="central"
        font-size="10" fill="#8b95a1">${v}</text>`;
  }
  // ป้ายแกน X (1, 10, 20, 30)
  let xl = '';
  [1,10,20,30].filter(d=>d<=n).forEach(d=>{
    xl += `<text x="${px(d-1)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="#8b95a1">${d}</text>`;
  });

  const band = (data, fill, line) => {
    const pts = data.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
    const base = `${px(data.length-1).toFixed(1)},${py(0)} ${px(0).toFixed(1)},${py(0)}`;
    return `<polygon points="${pts} ${base}" fill="${fill}" fill-opacity="0.55"/>
      <polyline points="${pts}" fill="none" stroke="${line}" stroke-width="1.6"/>
      ${data.map((v,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="2.2" fill="${line}"/>`).join('')}`;
  };

  // viewBox จำเป็น — ไม่มีแล้วเวลาจอแคบกราฟจะถูกตัดขวาทิ้ง ไม่ใช่ย่อลง
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
    preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto">
    ${grid}
    <line x1="${L}" y1="${py(0)}" x2="${W-R}" y2="${py(0)}" stroke="#adb5bd"/>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${py(0)}" stroke="#adb5bd"/>
    ${band(seriesA, '#f5b183', '#e08a4e')}
    ${band(seriesB, '#7fe4f5', '#3aa8cf')}
    ${xl}
    <text x="${L+(W-L-R)/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="#5a6470">วันที่</text>
    <text x="13" y="${T+(H-T-B)/2}" text-anchor="middle" font-size="11" fill="#5a6470"
      transform="rotate(-90 13 ${T+(H-T-B)/2})">จำนวนงาน</text>
  </svg>`;
}

/* ---------- รวบรวมตัวเลข ---------- */
function allEntries(filterFn){
  const out = [];
  EMPLOYEES.forEach(e=> Object.entries(SCHEDULE[e.id]).forEach(([k,list])=>
    list.forEach(x=>{ if(!filterFn || filterFn(k,x)) out.push({...x, date:k, emp:e.id}); })));
  return out;
}
function periodMonths(){
  if(dashPeriod === 1) return [TODAY.getMonth()];
  if(dashPeriod === 3) return [6,7,8];
  return [6,7,8];
}
function dailyTotals(ym){
  const [y,m] = ym.split('-').map(Number);
  const days = new Date(y, m+1, 0).getDate();
  const out = new Array(days).fill(0);
  EMPLOYEES.forEach(e=>{
    for(let d=1; d<=days; d++){
      const list = SCHEDULE[e.id][key(y,m,d)] || [];
      out[d-1] += list.filter(x=>x.type!=='leave').length;
    }
  });
  return out;
}
const ymLabel = ym => { const [y,m]=ym.split('-').map(Number); return `${MONTHS[m]} ${y}`; };

/* ==========================================================
   WORK STAGE — บอร์ดสถานะงาน (Kanban)
   ========================================================== */
const MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                     'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const STAGES = [
  {k:'plan', t:'TO DO',       cls:'todo',  badge:'grey'},
  {k:'wait', t:'IN PROGRESS', cls:'doing', badge:'gold'},
  {k:'done', t:'DONE',        cls:'done',  badge:'green'},
];

let stageDate  = new Date(TODAY);
let stageQuery = '';

/* รหัสงาน / เวลา / ทีม — สร้างจาก seed คงที่ ผลลัพธ์เดิมทุกครั้งที่เปิด */
function jobMeta(k, empId, i, e){
  const [y,m,d] = k.split('-').map(Number);
  const s  = y + m*31 + d*7 + empId.charCodeAt(1)*13 + i*17;
  const r1 = rnd(s), r2 = rnd(s*1.7), r3 = rnd(s*2.3);
  const code = ['DD','SD','CC','WW','MT'][Math.floor(r1*5)] + String(1000 + Math.floor(r2*8999));
  let time;
  if(e.type === 'done')      time = `${String(7+Math.floor(r3*6)).padStart(2,'0')}:${String(Math.floor(r1*60)).padStart(2,'0')}`;
  else if(e.type === 'wait') time = `${String(9+Math.floor(r3*4)).padStart(2,'0')}:00`;
  else                       time = '08:00';
  return {code, time, team: r3 > .78, showCode: r2 < .45};
}

function stageJobs(){
  const k = key(stageDate.getFullYear(), stageDate.getMonth(), stageDate.getDate());
  const out = [];
  EMPLOYEES
    .filter(e=> !stageQuery || (e.name+e.role).toLowerCase().includes(stageQuery.toLowerCase()))
    .forEach(e=> (SCHEDULE[e.id][k] || []).forEach((x,i)=>{
      if(x.type === 'leave') return;
      out.push({...x, ...jobMeta(k, e.id, i, x), emp:e, dateKey:k});
    }));
  return out.sort((a,b)=> a.time.localeCompare(b.time));
}

function renderStage(){
  // จำตำแหน่งเคอร์เซอร์ในช่องค้นหาไว้ ไม่ให้หลุดโฟกัสตอนพิมพ์

  const cardHtml = (j, cls) => `

        <div class="jc-ti">${j.showCode ? j.code : j.text}</div>

        <div class="jc-f">
          ${j.team ? `<span class="jc-team">Team</span>` : ''}
          <span class="jc-emp">${j.emp.name}</span>
          <span class="jc-av">${j.emp.ini}</span>
        </div>
      </div>
    </div>`;

  document.getElementById('canvas').innerHTML = `
  <div class="stage">
    <div class="sg-bar">
      <div class="sg-q"><input id="sgQ" placeholder="ค้นหาพนักงาน" value="${stageQuery}"><span class="si">&#128100;&#128269;</span></div>
      <div style="display:flex;align-items:center;gap:4px">
        <span class="sg-nb" id="sgPrev">&lsaquo;</span>
        <span class="sg-date">${dstr}</span>
        <span class="sg-nb" id="sgNext">&rsaquo;</span>
      </div>
      <button class="sg-today" id="sgToday">วันนี้</button>
      <span class="sg-sum">All = ${all}</span>
      <span class="sg-sum">Complete = ${doneN}</span>
      <span class="sg-pct">${pct}%</span>
    </div>

    <div class="sg-cols">
      ${STAGES.map(s=>{
        const list = jobs.filter(j=>j.type===s.k);
        return `<div class="sg-col">
          <div class="sg-h"><b>${s.t}</b><span class="cnt ${s.badge}">${list.length}</span></div>
          <div class="sg-cards">
            ${list.length ? list.map(j=>cardHtml(j, s.cls)).join('')
                          : `<div class="sg-empty">ไม่มีงานในสถานะนี้</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  const q = document.getElementById('sgQ');
  q.oninput = e=>{ stageQuery = e.target.value; renderStage(); };
  if(keepFocus){ q.focus(); q.setSelectionRange(caret, caret); }

  document.getElementById('sgPrev').onclick  = ()=>{ stageDate.setDate(stageDate.getDate()-1); renderStage(); };
  document.getElementById('sgNext').onclick  = ()=>{ stageDate.setDate(stageDate.getDate()+1); renderStage(); };

/* รหัสลูกค้า temp-xxxxx — ชื่อเดียวกันได้รหัสเดียวกันตลอด */
const B62 = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const _codeCache = {};
function custCode(name){
  if(_codeCache[name]) return _codeCache[name];
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  let s = '';
  for(let i=0;i<5;i++){ s += B62[h % 62]; h = Math.floor(h/62) + (i+1)*7919; }
  return _codeCache[name] = 'temp-' + s;
}

function lsRows(){
  const rows = [];
  const dates = [];
  if(lsApplied.mode === 'day'){
    dates.push(lsApplied.day);
  }else{
    const m = lsApplied.month, days = new Date(2026, m+1, 0).getDate();
    for(let d=1; d<=days; d++) dates.push(key(2026, m, d));
  }

  EMPLOYEES.forEach(e=> dates.forEach(k=>{
    const [y,mm,dd] = k.split('-').map(Number);
    const date = new Date(y, mm-1, dd);

    // แถววันหยุดประจำสัปดาห์ / วันหยุดนักขัตฤกษ์
    if(date.getDay() === DAY_OFF)
      rows.push({k, time:'08:00', emp:e, type:'off', cust:'วันหยุดประจำสัปดาห์', cat:'', prov:'', team:false});
    else if(HOLIDAYS[k])
      rows.push({k, time:'08:00', emp:e, type:'off', cust:HOLIDAYS[k], cat:'', prov:'', team:false});

    (SCHEDULE[e.id][k] || []).forEach((x,i)=>{
      const meta = jobMeta(k, e.id, i, x);
      if(x.type === 'leave'){
        rows.push({k, time:(x.time||'').split('-')[0] || '08:00', emp:e, type:'leave',
                   cust:x.text, cat:'ลา / ธุระส่วนตัว', prov:'', team:false});
      }else{
        const cust = meta.showCode ? meta.code : x.text;
        rows.push({k, time:meta.time, emp:e, type:x.type, cust,
                   cat:x.cat, prov:PROVINCE[x.text] || '—', team:meta.team, code:meta.code});
      }
    });
  }));

  return rows
    .filter(r=>{
      if(lsStatus !== 'all' && r.type !== lsStatus) return false;
      if(lsEmp    !== 'all' && r.emp.id !== lsEmp)  return false;
      if(lsProv   !== 'all' && r.prov !== lsProv)   return false;
      if(lsQuery){
        const s = [r.cust, r.emp.name, r.cat, r.prov, custCode(r.cust), r.code||''].join(' ').toLowerCase();
        if(!s.includes(lsQuery.toLowerCase())) return false;
      }
      return true;
    })
    .sort((a,b)=> (a.k+a.time).localeCompare(b.k+b.time));
}

function exportCsv(rows){
  const head = ['สถานะ','วันที่','เวลา','พนักงาน','ลูกทีม','เลขที่อ้างอิง','รหัสลูกค้า','ลูกค้า','จังหวัด','ประเภทงาน'];
  const esc  = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const body = rows.map(r=>[
    LS_STATUS[r.type].t, dmy(r.k), r.time, r.emp.name,
    r.team ? r.emp.name.split('  ')[0]+' +1' : '', '', custCode(r.cust), r.cust, r.prov, r.cat
  ].map(esc).join(','));
  // \uFEFF = BOM — ขาดไปแล้ว Excel บน Windows จะอ่านภาษาไทยเป็นตัวต่างดาว
  const blob = new Blob(['\uFEFF' + [head.map(esc).join(','), ...body].join('\r\n')],
    {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `รายการแผนงาน_${lsApplied.mode==='month' ? MONTHS_FULL[lsApplied.month]+'2026' : lsApplied.day}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
}

const GP_ROUTES = {                       // เส้นทางวนรอบพื้นที่รับผิดชอบจริงของแต่ละคน
  nakhonpathom:[[13.8196,100.0620],[13.8320,100.0810],[13.8180,100.1010],[13.7990,100.0870],[13.8050,100.0640],[13.8196,100.0620]],
  bangkok     :[[13.7563,100.5018],[13.7690,100.5330],[13.7480,100.5620],[13.7250,100.5340],[13.7360,100.5020],[13.7563,100.5018]],
  salaya      :[[13.7930,100.3210],[13.8110,100.3400],[13.7980,100.3640],[13.7760,100.3450],[13.7810,100.3200],[13.7930,100.3210]],
  ratchaburi  :[[13.5280,99.8130],[13.5460,99.8340],[13.5310,99.8560],[13.5090,99.8380],[13.5140,99.8120],[13.5280,99.8130]],
};
const GP_ROUTE_KM = {};
Object.entries(GP_ROUTES).forEach(([k,pts])=>{
  let m = 0;
  for(let i=0;i<pts.length-1;i++) m += haversine(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
  GP_ROUTE_KM[k] = m/1000;
});

function haversine(a,b,c,d){
  const R = 6371000, dLat = (c-a)*Math.PI/180, dLng = (d-b)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function gpPos(routeKey, t){
  const pts = GP_ROUTES[routeKey], total = pts.length-1;
  const f = ((t % 1) + 1) % 1 * total, i = Math.floor(f), frac = f - i;
  const a = pts[i], b = pts[Math.min(i+1,total)];
  return {lat: a[0]+(b[0]-a[0])*frac, lng: a[1]+(b[1]-a[1])*frac};
}

function note(){
  document.getElementById('gpNote').innerHTML = gpTraffic
    ? 'Traffic : ระบายสีเส้นทางตามความเร็วที่วัดได้ — แดง = ช้า/ติด, เขียว = ไหลลื่น (ไม่ใช่ข้อมูลจราจรจาก Google)'
    : 'ข้อมูลจำลอง · แผนที่จาก OpenStreetMap/CARTO (ไม่ต้องใช้ Google Maps API key)';
}

function gpVisible(){
  let list = gpsUnits.filter(u=> !gpQuery || u.emp.name.toLowerCase().includes(gpQuery.toLowerCase()));
  if(gpSort === 'name')  list = [...list].sort((a,b)=> a.emp.name.localeCompare(b.emp.name,'th'));
  if(gpSort === 'speed') list = [...list].sort((a,b)=> b.spd - a.spd);
  if(gpSort === 'time')  list = [...list].sort((a,b)=> tsKey(b.seen).localeCompare(tsKey(a.seen)));
  return list;
}
const tsKey = s =>{ const [d,t]=s.split(' '); const [dd,mm,yy]=d.split('/'); return `${yy}${mm}${dd}${t}`; };

function drawList(){
  document.getElementById('gpList').innerHTML = gpVisible().map(u=>{
    const st = GP_STATE[u.state];
    return `<div class="gu ${gpsSel===u.id?'on':''}" data-u="${u.id}">
      <div class="gu-av" style="border-color:${st.ring}">${u.emp.ini}</div>
      <div class="gu-b"><div class="gu-n">${u.emp.name}</div><div class="gu-t">${u.seen}</div></div>
      <div class="gu-r"><div class="gu-s">${st.t}</div>
        ${u.state==='GPS' ? `<div class="gu-sp">${u.spd.toFixed(0)} km/h</div>` : ''}</div>
    </div>`;
  }).join('') || `<div style="padding:24px;text-align:center;color:var(--txt3);font-size:12.5px">ไม่พบพนักงาน</div>`;

  document.querySelectorAll('.gu').forEach(el=>{
    el.onclick = ()=>{
      const u = gpsUnits.find(x=>x.id===el.dataset.u);
      gpsSel = gpsSel === u.id ? null : u.id;
      if(gpsSel) gpsMap.flyTo([u.lat,u.lng], Math.max(gpsMap.getZoom(), 13), {duration:.9});
      drawList(); drawMarkers();
    };
  });
}

/* จัดกลุ่มหมุดที่อยู่ใกล้กันเกิน 62 พิกเซล ให้เป็นวงกลมตัวเลขเดียว */
function clusterOf(list){
  const groups = [];
  list.forEach(u=>{
    const p = gpsMap.latLngToContainerPoint([u.lat,u.lng]);
    const g = groups.find(gr=> gr.p.distanceTo(p) < 62);
    if(g){ g.items.push(u); } else groups.push({p, items:[u]});
  });
  return groups;
}

function drawMarkers(){
  if(!gpsMap) return;
  gpsLayer.clearLayers();
  gpsTrailLayer.clearLayers();
  const list = gpVisible();

  if(gpTraffic) list.forEach(u=>{
    for(let i=1;i<u.trail.length;i++){
      const d = haversine(u.trail[i-1][0],u.trail[i-1][1],u.trail[i][0],u.trail[i][1]);
      const kmh = d/1000 * 1200;                       // ระยะใน 3 วิ → กม./ชม.
      const c = kmh < 20 ? '#e03131' : kmh < 50 ? '#f59f00' : '#2f9e44';
      L.polyline([u.trail[i-1],u.trail[i]],{color:c,weight:5,opacity:.8}).addTo(gpsTrailLayer);
    }
  });

  const groups = gpCluster ? clusterOf(list) : list.map(u=>({items:[u]}));
  groups.forEach(g=>{
    if(g.items.length > 1){
      const lat = g.items.reduce((s,u)=>s+u.lat,0)/g.items.length;
      const lng = g.items.reduce((s,u)=>s+u.lng,0)/g.items.length;
      L.marker([lat,lng], {icon:L.divIcon({html:`<div class="gc">${g.items.length}</div>`,
        className:'', iconSize:[52,52], iconAnchor:[26,26]})})
        .on('click', ()=> gpsMap.flyToBounds(
          L.latLngBounds(g.items.map(u=>[u.lat,u.lng])).pad(.6), {duration:.8}))
        .addTo(gpsLayer);
    }else{
      const u = g.items[0], st = GP_STATE[u.state];
      L.marker([u.lat,u.lng], {icon:L.divIcon({
        html:`<div class="gm ${gpsSel===u.id?'sel':''}">
                <div class="gm-av" style="border-color:${st.ring}">${u.emp.ini}</div>
                <div class="gm-lbl">${u.emp.name.split('  ')[0]}</div></div>`,
        className:'', iconSize:[40,40], iconAnchor:[20,20]})})
        .bindPopup(`<div class="gp-pop"><h4>${u.emp.name}</h4>
          <div class="gp-pr"><span>สถานะ</span><b style="color:${st.ring}">${st.t}</b></div>
          <div class="gp-pr"><span>ความเร็ว</span><b>${u.state==='GPS' ? u.spd.toFixed(0)+' กม./ชม.' : '—'}</b></div>
          <div class="gp-pr"><span>อัปเดตล่าสุด</span><b>${u.seen}</b></div>
          <div class="gp-pr"><span>พิกัด</span><b>${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</b></div></div>`)
        .on('click', ()=>{ gpsSel = u.id; drawList(); drawMarkers(); })
        .addTo(gpsLayer);
    }
  });
}

function gpsTick(){
  if(!gpsMap) return;
  gpsUnits.forEach(u=>{
    if(u.state !== 'GPS') return;                       // ไม่มีสัญญาณ GPS = พิกัดไม่ขยับ
    u.spd = Math.max(24, Math.min(104, u.spd + (Math.random()-.5)*11));
    u.t  += (u.spd * 3/3600) / GP_ROUTE_KM[u.route];
    Object.assign(u, gpPos(u.route, u.t));
    u.trail.push([u.lat,u.lng]);
    if(u.trail.length > 90) u.trail.shift();
    const now = new Date(2026, 7, 26, 13, 52 + Math.floor(u.t*3) % 8);
    u.seen = `26/08/2026 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  });
  drawList(); drawMarkers();
}

/* ==========================================================
   GPS PLAYBACK — ย้อนดูเส้นทาง
   ========================================================== */
const DOW_ABBR = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const EV_ICON  = {in:'⏻', start:'▶', visit:'⚲', out:'✔'};

/* '2026-08-25T00:00' → '25/08/2026 00:00' (รูปแบบไทย ไม่ขึ้นกับ locale เครื่อง) */
function fmtDT(v){
  if(!v) return '';
  const [d,t] = v.split('T');
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y} ${(t||'00:00').slice(0,5)}`;
}
/* '2026-08-26' → '26 ส.ค. 2026' */
function fmtD(v){
  if(!v) return '';
  const [y,m,d] = v.split('-').map(Number);
  return `${d} ${MONTHS[m-1]} ${y}`;
}
/* คลิกที่ไหนก็ได้ในช่องวันที่ → เปิดปฏิทินของเบราว์เซอร์ */
function bindDatePickers(root){
  (root || document).querySelectorAll('.fld.dt, .cdt').forEach(el=>{
    el.onclick = ()=>{
      const inp = document.getElementById(el.dataset.for);
      if(!inp) return;
      if(inp.showPicker){ try{ inp.showPicker(); return; }catch(_){} }
      inp.focus();
    };
  });
}
const EMP_ROUTE = {E1:'salaya', E2:'nakhonpathom', E3:'bangkok', E4:'ratchaburi',
                   E5:'nakhonpathom', E6:'salaya'};

/* วันที่เช็คอินแล้วไม่ได้ออกเดินทาง — ระยะทาง GPS = 0 (ตรงกับหน้าจอตัวอย่าง) */
const NO_TRIP = {'E1|2026-08-25':true};

let pbEmp = 'E1', pbFrom = '2026-08-25T00:00', pbTo = '2026-08-25T23:59';
let pbMap = null, pbTimer = null, pbTrackLayer = null, pbEvLayer = null, pbDotLayer = null, pbTiles = null;
let pbData = null, pbIdx = 0, pbPlaying = false, pbSpeed = 1, pbSel = null, pbBase = 'แผนที่';

function stopPb(){
  if(pbTimer){ clearInterval(pbTimer); pbTimer = null; }
  if(pbMap){ pbMap.remove(); pbMap = null; }
  pbTrackLayer = pbEvLayer = pbDotLayer = pbTiles = null;
  pbPlaying = false;
}

/* ---------- สร้างเส้นทางย้อนหลังของ 1 วัน ---------- */
function buildDay(empId, k){
  const routeKey = EMP_ROUTE[empId];
  const pts0 = GP_ROUTES[routeKey];
  const [y,m,d] = k.split('-').map(Number);
  const emp = EMPLOYEES.find(e=>e.id===empId);
  const jobs = (SCHEDULE[empId][k] || []).filter(x=>x.type!=='leave');
  const anchor = pts0[0];
  const hhmm = (h,mi)=> `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;

  // วันที่ไม่ได้ออกเดินทาง
  if(NO_TRIP[`${empId}|${k}`] || !jobs.length){
    return {k, emp, km:0, points:[], events:[
      {t:hhmm(8,1),  kind:'in',  label:'Checkin No Start Trip', detail:'',
       lat:anchor[0], lng:anchor[1], pinColor:'#f0b429', pinLabel:'Checkin'},
      {t:hhmm(17,20),kind:'out', label:'Check Out', detail: jobs[0]?.text || 'บริษัท วรรณวนัช เบเกอรี่ จำกัด',
       lat:anchor[0]+0.0042, lng:anchor[1]-0.0018, pinColor:'#2f9e44', pinLabel:'Check Out'},
    ]};
  }

  // สุ่มแบบคงที่: จำนวนรอบที่วิ่งในวันนั้น
  const loops = 1 + rnd(d*3 + empId.charCodeAt(1)) * 1.4;
  const N = 150;
  const total = GP_ROUTE_KM[routeKey] * loops;
  const points = [];
  for(let i=0;i<N;i++){
    const f = i/(N-1);
    const p = gpPos(routeKey, f*loops);
    const mins = Math.round(8*60 + 10 + f*(9*60 - 40));       // 08:10 → 17:20
    points.push({lat:p.lat, lng:p.lng, t:hhmm(Math.floor(mins/60), mins%60), km:+(total*f).toFixed(2)});
  }

  const events = [
    {t:hhmm(8,Math.floor(rnd(d)*9)), kind:'in', label:'Check In', detail:'เริ่มงาน',
     lat:points[0].lat, lng:points[0].lng, pinColor:'#f0b429', pinLabel:'Checkin'},
    {t:points[0].t, kind:'start', label:'Start Trip', detail:'เริ่มออกเดินทาง',
     lat:points[0].lat, lng:points[0].lng},
  ];
  jobs.forEach((j,i)=>{
    const at = points[Math.floor((i+1)/(jobs.length+1) * (N-1))];
    events.push({t:at.t, kind:'visit', label:'Check In', detail:j.text,
      lat:at.lat, lng:at.lng, pinColor:'#e03131', pinLabel:j.text.slice(0,18)});
  });
  const last = points[N-1];
  events.push({t:hhmm(17,20), kind:'out', label:'Check Out', detail:'บริษัท วรรณวนัช เบเกอรี่ จำกัด',
    lat:last.lat, lng:last.lng, pinColor:'#2f9e44', pinLabel:'Check Out'});

  return {k, emp, km:+total.toFixed(2), points, events:events.sort((a,b)=>a.t.localeCompare(b.t))};
}

/* ---------- รวมทุกวันในช่วงเวลาที่เลือก (จำกัด 7 วัน) ---------- */
function buildPb(){
  const d0 = new Date(pbFrom), d1 = new Date(pbTo);
  if(isNaN(d0) || isNaN(d1) || d1 < d0) return {km:0, points:[], events:[], days:0, tooWide:false};
  const days = [];
  for(let d = new Date(d0.getFullYear(),d0.getMonth(),d0.getDate());
      d <= d1 && days.length < 7;
      d.setDate(d.getDate()+1)) days.push(key(d.getFullYear(), d.getMonth(), d.getDate()));

  const parts = days.map(k=> buildDay(pbEmp, k));
  return {
    km: +parts.reduce((s,p)=>s+p.km, 0).toFixed(2),
    points: parts.flatMap(p=> p.points.map(x=>({...x, k:p.k}))),
    events: parts.flatMap(p=> p.events.map(x=>({...x, k:p.k}))),
    days: days.length,
    tooWide: (d1 - d0) / 864e5 > 7,
  };
}

      : `<div class="pb-empty">ไม่มีเส้นทาง GPS ในวันนี้<br>
           <span style="font-size:11.5px">พนักงานเช็คอินแล้วแต่ไม่ได้ออกเดินทาง</span></div>`}
      ${pbData.tooWide ? `<div class="gp-note" style="border-color:#e8b21e">

function pbSetBase(){
  const b = BASEMAPS[pbBase];
  if(pbTiles) pbMap.removeLayer(pbTiles);
  pbTiles = L.tileLayer(b.url, {attribution:b.attr, maxZoom:b.max, subdomains:b.sub || 'abc'}).addTo(pbMap);
  pbTiles.bringToBack();
}

function pbDraw(){
  if(!pbMap) return;
  pbTrackLayer.clearLayers(); pbEvLayer.clearLayers(); pbDotLayer.clearLayers();

  if(pbData.points.length){
    const line = pbData.points.map(p=>[p.lat,p.lng]);
    L.polyline(line, {color:'#1971c2', weight:4, opacity:.45}).addTo(pbTrackLayer);
    L.polyline(line.slice(0, pbIdx+1), {color:'#1971c2', weight:5, opacity:.95}).addTo(pbTrackLayer);
    const cur = pbData.points[pbIdx];
    L.marker([cur.lat,cur.lng], {icon:L.divIcon({html:'<div class="pdot"></div>', className:'',
      iconSize:[17,17], iconAnchor:[8,8]}), zIndexOffset:800}).addTo(pbDotLayer);
  }

  pbData.events.forEach((e,i)=>{
    if(!e.pinColor) return;
    L.marker([e.lat,e.lng], {icon:L.divIcon({
      html:`<div class="pm ${pbSel===i?'sel':''}">
              <div class="pm-pin" style="--c:${e.pinColor}"></div>
              <div class="pm-lb">${e.pinLabel}</div></div>`,
      className:'', iconSize:[22,30], iconAnchor:[11,30]})})
      .on('click', ()=>{
        pbSel = i;
        document.querySelectorAll('.pe').forEach((x,j)=> x.classList.toggle('on', j===i));
        document.getElementById('pbInfo').classList.add('on');
        pbDraw();
      }).addTo(pbEvLayer);
  });
}

function pbClock(){
  const p = pbData.points[pbIdx];
  document.getElementById('pbClock').textContent = `${p.t} · ${p.km.toFixed(2)} km`;
}
function pbToggle(){
  pbPlaying = !pbPlaying;
  document.getElementById('pbPlay').textContent = pbPlaying ? '❚❚' : '▶';
  pbPlaying ? pbRun() : clearInterval(pbTimer);
}
function pbRun(){
  clearInterval(pbTimer);
  pbTimer = setInterval(()=>{
    if(!pbMap) return clearInterval(pbTimer);
    pbIdx++;
    if(pbIdx >= pbData.points.length){ pbIdx = pbData.points.length-1; pbToggle(); return; }
    document.getElementById('pbSlider').value = pbIdx;
    pbDraw(); pbClock();
  }, 260/pbSpeed);
}

/* ---------- เลือกลูกทีม ---------- */
let tmTeam = [], tmChk = new Set();          // tmTeam = ลูกทีมในกล่องขวา, tmChk = ที่ติ๊กไว้
function openTeamModal(){
  tmTeam = [...woF.team]; tmChk = new Set();
  const leader = EMPLOYEES.find(e=>e.name === woF.emp);
  const first  = n => n.split('  ')[0];

  const draw = ()=>{
    const left  = EMPLOYEES.filter(e=> e.id !== leader.id && !tmTeam.includes(e.id));
    const right = tmTeam.map(id=> EMPLOYEES.find(e=>e.id===id));
    const item = (e, dis)=>`<div class="tm-i ${tmChk.has(e.id)?'on':''} ${dis?'dis':''}"
      ${dis?'':`data-tm="${e.id}"`}><i>✓</i>${first(e.name)}</div>`;

    document.getElementById('md').className = 'md wide';
    document.getElementById('md').innerHTML = `
      <div class="tm-h">เลือกลูกทีม</div>
      <div class="tm-b">
        <div class="tm-col">${left.length ? left.map(e=>item(e,false)).join('')
          : `<div class="tm-empty">ทุกคนอยู่ในทีมแล้ว</div>`}</div>
        <div class="tm-mid">
          <button id="tmR" ${left.some(e=>tmChk.has(e.id))?'':'disabled'}>&gt;</button>
          <button id="tmL" ${right.some(e=>tmChk.has(e.id))?'':'disabled'}>&lt;</button>
        </div>
        <div class="tm-col">
          ${item(leader, true)}
          ${right.map(e=>item(e,false)).join('')}
        </div>
      </div>
      <div class="tm-f"><button class="tm-ok" id="tmOk">OK</button></div>`;

    document.querySelectorAll('[data-tm]').forEach(el=>{
      el.onclick = ()=>{
        const id = el.dataset.tm;
        tmChk.has(id) ? tmChk.delete(id) : tmChk.add(id);
        draw();
      };
    });
    document.getElementById('tmR').onclick = ()=>{
      EMPLOYEES.forEach(e=>{ if(tmChk.has(e.id) && !tmTeam.includes(e.id) && e.id !== leader.id) tmTeam.push(e.id); });
      tmChk = new Set(); draw();
    };
    document.getElementById('tmL').onclick = ()=>{
      tmTeam = tmTeam.filter(id=> !tmChk.has(id));
      tmChk = new Set(); draw();
    };
    document.getElementById('tmOk').onclick = ()=>{
      woF.team = [...tmTeam];
      document.getElementById('md').className = 'md';
      closeModal(); renderWoCreate();
      if(woF.team.length) toast(`เพิ่มลูกทีม ${woF.team.length} คนแล้ว`);
    };
  };
  draw();
  document.getElementById('ov').classList.add('on');
}

  d.textContent = `${now.getDate()} ${MONTHS_FULL[now.getMonth()]} ${now.getFullYear()}`;

function woSubmit(){
  const cust = woF.newCust ? woF.ncName : woF.cust;

  if(woF.draft){
    woDrafts.push({when:woF.when, ref:woF.ref, jobType:woF.jobType, tags:[...woF.tags],
      cust, contact:woF.contact, place:woF.place, tempPlace:woF.tempPlace, emp:woF.emp,
      team:[...woF.team], related:woF.related, mkt:woF.mkt, detail:woF.detail,
      wfList:[...woF.wfList], savedAt:nowStamp()});
    toast(`บันทึกแบบร่างแล้ว · ดูได้ที่เมนู Draft (มี ${woDrafts.length} รายการ)`);
    document.getElementById('woReset').click();
    return;
  }

  const empObj = EMPLOYEES.find(e=>e.name===woF.emp);
  const k = woF.when.split('T')[0];
  (SCHEDULE[empObj.id][k] = SCHEDULE[empObj.id][k] || [])
    .push({type:'plan', text:cust, cat:woF.jobType});
  if(woF.newCust && !PROVINCE[cust]) PROVINCE[cust] = '—';
  toast(`สร้างคำสั่งงานแล้ว · ${cust} · ${dmy(k)}`);
  document.getElementById('woReset').click();
}
function toast(msg, ok = true){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (ok ? '' : ' warn');
  el.innerHTML = `${ok ? '✓' : '!'} ${msg}`;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 3600);
}

function bindMulti(){
  document.getElementById('mAdd').onclick = ()=>{ woRows.push(blankRow()); renderWoCreate(); };
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      if(woRows.length === 1) return toast('ต้องมีอย่างน้อย 1 รายการ', false);
      woRows.splice(+el.dataset.del, 1); renderWoCreate();
    };
  });
  document.querySelectorAll('.mt tbody [data-f]').forEach(el=>{
    const i = +el.closest('tr').dataset.r, f = el.dataset.f;
    // select และช่องวันที่ต้องวาดใหม่ (วันที่ต้องอัปเดตข้อความไทยที่ทับอยู่)

      el.onchange = e=>{ woRows[i][f] = e.target.value; renderWoCreate(); };
    else el.oninput = e=>{ woRows[i][f] = e.target.value; };
  });
  const save = draft => ()=>{
    // แบบร่างบันทึกได้แม้กรอกไม่ครบ — ที่ยังไม่ครบคือเหตุผลที่มันเป็นร่าง
    const ok = draft ? woRows.filter(r=> r.jobType || r.cust || r.lead) : woRows.filter(rowReady);
    if(!ok.length) return toast(draft ? 'ยังไม่มีรายการที่กรอกอะไรเลย'
                                     : 'ยังไม่มีรายการที่กรอกช่องบังคับครบ', false);
    if(draft){
      ok.forEach(r=> woDrafts.push({when:r.when, ref:r.ref, jobType:r.jobType, tags:r.tag?[r.tag]:[],
        cust:r.cust, contact:r.contact, place:r.place, tempPlace:true, emp:r.lead,
        team:r.team?[EMPLOYEES.find(e=>e.name===r.team)?.id].filter(Boolean):[],
        related:r.related, mkt:r.mkt, detail:r.detail,
        wfList:r.wf?[r.wf]:[], savedAt:nowStamp()}));
      toast(`บันทึกแบบร่าง ${ok.length} รายการแล้ว · ดูได้ที่เมนู Draft`);
    }else{
      ok.forEach(r=>{
        const emp = EMPLOYEES.find(e=>e.name===r.lead);
        const k = r.when.split('T')[0];
        (SCHEDULE[emp.id][k] = SCHEDULE[emp.id][k] || [])
          .push({type:'plan', text:r.cust, cat:r.jobType});
      });
      toast(`สร้างคำสั่งงาน ${ok.length} รายการแล้ว`);
    }
    woRows = [blankRow()]; renderWoCreate();
  };
  bindDatePickers();
  document.getElementById('mMake').onclick  = save(false);
  document.getElementById('mDraft').onclick = save(true);
}

/* วันที่ที่เข้าเงื่อนไขงานประจำ */
function recurDates(){
  const out = [], d0 = new Date(woR.from), d1 = new Date(woR.to);
  if(isNaN(d0) || isNaN(d1) || d1 < d0) return out;
  const nums = woR.dateVal.split(',').map(s=>+s.trim()).filter(n=>n>=1 && n<=31);
  for(let d = new Date(d0); d <= d1 && out.length < 200; d.setDate(d.getDate()+1)){
    const okDate = woR.byDate && nums.includes(d.getDate());
    const okDay  = woR.byDay  && (woR.days.length ? woR.days.includes(d.getDay()) : true);
    if(okDate || okDay) out.push(key(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  return out;
}

      }else if(k !== aqApplied.day) return false;
    }
    if(aqQuery){
      const e = EMPLOYEES.find(x=>x.id===r.from);
      const s = [r.note, r.form, r.to, e?.name, fmtDT(r.at)].join(' ').toLowerCase();
      if(!s.includes(aqQuery.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=> b.at.localeCompare(a.at));
}

/* ==========================================================
   CONTINUED WORK · REPORT — รายงานงานต่อเนื่อง
   งานต่อเนื่อง = งานที่ลูกค้าเดิม พนักงานเดิม เกิดซ้ำหลายครั้งในช่วงเวลาที่เลือก
   ========================================================== */
let crTab = 'sum', crAllEmp = true, crEmp = '', crRange = 'day';
let crFrom = '2026-08-30', crTo = '2026-08-30', crRows = null;

function crCollect(){
  const dates = [];
  if(crRange === 'day'){
    const d0 = new Date(crFrom), d1 = new Date(crTo);
    if(isNaN(d0) || isNaN(d1) || d1 < d0) return [];
    for(let d = new Date(d0); d <= d1; d.setDate(d.getDate()+1))
      dates.push(key(d.getFullYear(), d.getMonth(), d.getDate()));
  }else{
    const m = new Date(crFrom).getMonth(), days = new Date(2026, m+1, 0).getDate();
    for(let d=1; d<=days; d++) dates.push(key(2026, m, d));
  }

  const out = [];
  EMPLOYEES.forEach(e=>{
    if(!crAllEmp && crEmp && e.name !== crEmp) return;
    dates.forEach(k=>{
      (SCHEDULE[e.id][k] || []).forEach((x,i)=>{
        if(x.type === 'leave') return;
        const meta = jobMeta(k, e.id, i, x);
        const due = +meta.time.replace(':','');
        // เช็คอินจริงของงานที่ทำแล้ว — ส่วนใหญ่ตรงเวลา ราว 30% มาสาย
        const rr = rnd(k.length + i*13 + e.id.charCodeAt(1));
        const lateMin = x.type !== 'done' ? null
                      : rr < .7 ? 0 : 1 + Math.floor((rr - .7) / .3 * 55);
        const inM = x.type === 'done'
          ? (+meta.time.slice(0,2))*60 + (+meta.time.slice(3)) + lateMin : null;
        const durM = x.type === 'done' ? 45 + Math.floor(rnd(i*7 + k.length)*95) : null;
        const hhmm = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
        out.push({
          k, time:meta.time, emp:e, cust:x.text, cat:x.cat,
          ref: meta.showCode ? meta.code : '',
          tag: meta.team ? 'งานทีม' : WO_TAGS[Math.floor(rnd(k.length+i*3)*3)],
          done: x.type === 'done',
          inT:  inM  !== null ? hhmm(inM) : '',
          outT: inM  !== null ? hhmm(inM + durM) : '',
          durM, lateMin,
        });
      });
    });
  });
  return out.sort((a,b)=> (a.k+a.time).localeCompare(b.k+b.time));
}

/* รวมเป็นชุดงานต่อเนื่อง: ลูกค้าเดียวกัน + พนักงานคนเดียวกัน */
function crChains(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key2 = r.emp.id + '|' + r.cust;
    if(!map.has(key2)) map.set(key2, []);
    map.get(key2).push(r);
  });
  return [...map.values()].map(g=>{
    const first = g[0], last = g[g.length-1];
    const span = Math.round((new Date(last.k) - new Date(first.k)) / 864e5) + 1;
    return {first, last, n:g.length, span, closed: g.every(x=>x.done), items:g};
  }).sort((a,b)=> (a.first.k+a.first.time).localeCompare(b.first.k+b.first.time));
}

const durTxt = m => m == null ? '—' : `${Math.floor(m/60)} ชม. ${String(m%60).padStart(2,'0')} น.`;

                  <td>${c.span}</td>
                  <td>${c.closed ? '<span class="pill-ok">ปิดแล้ว</span>'
                                 : '<span class="pill-no">ยังไม่ปิด</span>'}</td>
                </tr>`).join('')}</tbody>`
            : `<tbody>${rows.map(r=>`
                <tr>
                  <td>${dmy(r.k)} ${r.time}</td>

        </table>
        ${rows === null ? `<div class="cr-none">เลือกเงื่อนไขแล้วกด GO เพื่อออกรายงาน</div>`
          : (crTab==='sum' ? chains.length : rows.length) === 0

      </div>

        : `${rows.length} งาน · ปิดแล้ว ${rows.filter(r=>r.done).length} · ล่าช้า ${rows.filter(r=>r.lateMin).length}`}</div>`}
    </div>
  </div>`;

  document.querySelectorAll('[data-crt]').forEach(el=>{

/* ==========================================================
   WORK ORDER · SEARCH — ข้อมูลประวัติงาน
   ========================================================== */
const WO_TAGS = ['ด่วน','ปกติ','ติดตาม','งานทีม'];
let scF = {
  allEmp:true, emp:'', allCust:true, cust:'', allJob:true, job:'', allTag:true, tag:'',
  mode:'ref', ref:'', range:'month', day:'2026-08-26', month:7,
};
let scResults = null, scQuery = '';

/* เลขที่คำสั่งงาน — คงที่ต่อ (พนักงาน, วัน, ลำดับ) */
function woNo(empId, k, i){
  const d = k.replace(/-/g,'').slice(2);
  return `WO${d}-${empId.slice(1)}${String(i+1).padStart(2,'0')}`;
}

function scSearch(){
  const dates = [];
  if(scF.range === 'day') dates.push(scF.day);
  else {
    const days = new Date(2026, scF.month+1, 0).getDate();
    for(let d=1; d<=days; d++) dates.push(key(2026, scF.month, d));
  }

  const out = [];
  EMPLOYEES.forEach(e=>{
    if(!scF.allEmp && scF.emp && e.name !== scF.emp) return;
    dates.forEach(k=>{
      (SCHEDULE[e.id][k] || []).forEach((x,i)=>{
        if(x.type === 'leave') return;
        if(!scF.allJob  && scF.job  && x.cat  !== scF.job)  return;
        if(!scF.allCust && scF.cust && x.text !== scF.cust) return;

        const meta = jobMeta(k, e.id, i, x);
        const tag = meta.team ? 'งานทีม' : WO_TAGS[Math.floor(rnd(k.length + i*7 + e.id.charCodeAt(1))*3)];
        if(!scF.allTag && scF.tag && tag !== scF.tag) return;

        const no  = woNo(e.id, k, i);
        const ref = meta.showCode ? meta.code : '';
        // ค้นด้วยรหัส: W/O Reference ค้นที่เลขอ้างอิง, Workorder ID ค้นที่เลขที่คำสั่งงาน
        if(scF.ref.trim()){
          const needle = scF.ref.trim().toLowerCase();
          const hay = (scF.mode === 'ref' ? ref : no).toLowerCase();
          if(!hay.includes(needle)) return;
        }
        out.push({
          created: createdAt(k, e.id, i, false), no, ref,
          due: `${dmy(k)} ${meta.time}`,
          inT:  x.type === 'done' ? meta.time : '',
          outT: x.type === 'done'
            ? `${String(Math.min(19, +meta.time.slice(0,2) + 1 + (i%2))).padStart(2,'0')}:${meta.time.slice(3)}`
            : '',
          cat:x.cat, cust:x.text, emp:e.name, tag, status:x.type,
          prov: PROVINCE[x.text] || '—',
        });
      });
    });
  });
  return out.sort((a,b)=> a.due.split(' ')[0].split('/').reverse().join('')
                          .localeCompare(b.due.split(' ')[0].split('/').reverse().join('')));
}

const SC_ST = {
  done :{t:'สำเร็จ',      bg:'#dff2e0', bd:'#a8dcae', c:'#2f6b37'},
  plan :{t:'ยังไม่เช็คอิน', bg:'#eceef0', bd:'#d3d7dd', c:'#4a545f'},
  wait :{t:'รออนุมัติ',    bg:'#fdf0cd', bd:'#e8c862', c:'#6b5209'},

            <th>ประเภทงาน</th><th>Tag(Work)</th><th>ลูกค้า</th><th>ผู้ปฏิบัติงาน</th>

          </tr></thead>
          ${rows.length ? `<tbody>${rows.map((r,i)=>{
            const s = SC_ST[r.status];
            return `<tr>
              <td class="seq">${i+1}</td>

              <td>${r.due}</td>

              <td class="${r.outT?'':'dash'}">${r.outT || '—'}</td>
              <td>${r.cat}</td>
              <td>${r.tag}</td>

        </table>
        ${rows.length ? '' : `<div class="sc-none">${scResults === null
          ? 'No Rows To Show' : scQuery ? 'ไม่พบรายการที่ตรงกับคำค้น'
          : 'No Rows To Show — ไม่พบข้อมูลตามเงื่อนไขที่เลือก'}</div>`}
      </div>
      ${scResults !== null ? `<div class="sc-cnt">ค้นพบ ${scResults.length} รายการ${
        scQuery ? ` · แสดง ${rows.length} รายการที่ตรงกับ "${scQuery}"` : ''}</div>` : ''}
    </div>
  </div>`;

  /* --- ตัวกรอง --- */
  document.querySelectorAll('[data-sc]').forEach(el=>{
