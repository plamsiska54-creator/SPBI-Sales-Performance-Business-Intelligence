<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ต้นทุนบูธ - Preview</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:#f8f9fa;color:#1e293b;font-size:14px}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .kpi{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .kpi-label{font-size:11px;color:#64748b;font-weight:600;margin-bottom:6px}
  .kpi-value{font-size:22px;font-weight:800}
  .kpi-sub{font-size:11px;color:#94a3b8;margin-top:4px}
  .card{background:#fff;border-radius:14px;padding:20px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
  .sel{border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer;background:#fff;color:#1e293b;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#1e293b;color:#fff;padding:8px 10px;text-align:center;font-size:11px;font-weight:700;white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  tr:hover td{background:#f8fafc}
  .pos{color:#16a34a;font-weight:700}
  .neg{color:#dc2626;font-weight:700}
  .section-title{font-size:15px;font-weight:800;color:#1e293b;margin-bottom:14px}
</style>
</head>
<body>
<div style="padding:20px">

    <div style="margin-left:auto;display:flex;gap:8px">
      <select class="sel" id="costYr" onchange="renderCost()"></select>
      <select class="sel" id="costMo" onchange="renderCost()"></select>
    </div>
  </div>
  
  <div class="kpi-grid" id="costKPI"></div>
  
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="card">
      <div class="section-title">📊 กำไร-ขาดทุนแต่ละบูธ</div>
      <canvas id="profitChart" height="220"></canvas>
    </div>
    <div class="card">
      <div class="section-title">🥧 สัดส่วนค่าใช้จ่ายรวม</div>
      <canvas id="costChart" height="220"></canvas>
    </div>
  </div>
  
  <div class="card" style="margin-bottom:16px">
    <div class="section-title">📈 แนวโน้มกำไรรายเดือน</div>
    <canvas id="trendChart" height="100"></canvas>
  </div>
  
  <div class="card" id="costTable">
    <div class="section-title">📋 รายละเอียดต้นทุนแต่ละบูธ</div>
  </div>
</div>

var MONTH_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var chartProfit, chartCost, chartTrend;

function fmt(n,dec){
  dec = dec||0;
  if(!n) return '-';
  return Math.round(n).toLocaleString('th-TH');
}
function fmtB(n){ if(!n&&n!==0) return '-'; var v=Math.round(n).toLocaleString('th-TH'); return (n<0?'-':'')+'฿'+Math.abs(Math.round(n)).toLocaleString('th-TH'); }
function pct(n,d){ return d?((n/d)*100).toFixed(1)+'%':'0%'; }

// Init selectors
function initSelectors(){
  var yrEl=document.getElementById('costYr');
  var moEl=document.getElementById('costMo');
  var years=Object.keys(COST_DATA).map(Number).sort(function(a,b){return b-a;});
  yrEl.innerHTML=years.map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('');
  var yr=years[0];
  var months=Object.keys(COST_DATA[yr]).map(Number).sort(function(a,b){return b-a;});
  moEl.innerHTML=months.map(function(m){return '<option value="'+m+'">'+MONTH_TH[m]+'</option>';}).join('');
  yrEl.onchange=function(){
    var y=parseInt(this.value);
    var ms=Object.keys(COST_DATA[y]).map(Number).sort(function(a,b){return b-a;});
    moEl.innerHTML=ms.map(function(m){return '<option value="'+m+'">'+MONTH_TH[m]+'</option>';}).join('');
    renderCost();
  };
}

function renderCost(){
  var yr=parseInt(document.getElementById('costYr').value);
  var mo=parseInt(document.getElementById('costMo').value);
  var d=COST_DATA[yr]&&COST_DATA[yr][mo];
  if(!d){document.getElementById('costTable').innerHTML='<div style="color:#94a3b8;padding:24px;text-align:center">ไม่มีข้อมูล</div>';return;}
  
  var booths=Object.keys(d);
  var totSale=0,totGross=0,totNet=0,totCogs=0,totDisc=0;
  booths.forEach(function(b){
    totSale+=d[b].sale||0; totGross+=d[b].gross||0; totNet+=d[b].net_profit||0;
    totCogs+=d[b].cogs||0; totDisc+=d[b].disc||0;
  });
  
  // KPI cards
  var netColor=totNet>=0?'#16a34a':'#dc2626';
  var grossPct=totSale?((totGross/totSale)*100).toFixed(1):0;
  var netPct=totSale?((totNet/totSale)*100).toFixed(1):0;
  document.getElementById('costKPI').innerHTML=
    '<div class="kpi" style="border-top:4px solid #f97316">'
      +'<div class="kpi-label">ยอดขายรวม</div>'
      +'<div class="kpi-value" style="color:#f97316">฿'+fmt(totSale)+'</div>'
      +'<div class="kpi-sub">ส่วนลด ฿'+fmt(totDisc)+'</div></div>'
    +'<div class="kpi" style="border-top:4px solid #3b82f6">'
      +'<div class="kpi-label">กำไรขั้นต้น (หลังหักต้นทุนขนม)</div>'
      +'<div class="kpi-value" style="color:#3b82f6">฿'+fmt(totGross)+'</div>'
      +'<div class="kpi-sub">'+grossPct+'% ของยอดขาย</div></div>'
    +'<div class="kpi" style="border-top:4px solid '+netColor+'">'
      +'<div class="kpi-label">กำไรสุทธิ (หลังหักค่าใช้จ่ายทั้งหมด)</div>'
      +'<div class="kpi-value" style="color:'+netColor+'">฿'+fmt(totNet)+'</div>'
      +'<div class="kpi-sub">'+netPct+'% ของยอดขาย</div></div>'
    +'<div class="kpi" style="border-top:4px solid #8b5cf6">'
      +'<div class="kpi-label">ต้นทุนขนม</div>'
      +'<div class="kpi-value" style="color:#8b5cf6">฿'+fmt(totCogs)+'</div>'
      +'<div class="kpi-sub">'+pct(totCogs,totSale)+' ของยอดขาย</div></div>';
  
  // Bar chart: profit per booth
  var profits=booths.map(function(b){return Math.round(d[b].net_profit||0);});
  var colors=profits.map(function(v){return v>=0?'rgba(22,163,74,0.8)':'rgba(220,38,38,0.8)';});
  if(chartProfit) chartProfit.destroy();
  chartProfit=new Chart(document.getElementById('profitChart'),{
    type:'bar',
    data:{labels:booths,datasets:[{label:'กำไรสุทธิ (฿)',data:profits,backgroundColor:colors,borderRadius:6}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return v.toLocaleString();}}}}}
  });
  
  // Doughnut chart: cost breakdown
  var costKeys=[
    ['wage','ค่าแรง'],['com','ค่าคอม'],['staff','พนักงานรายเดือน'],
    ['rent','ค่าเช่า'],['elec','ค่าไฟ'],['other_sum','อื่นๆ']
  ];
  var costVals={};
  booths.forEach(function(b){
    var bd=d[b];
    costVals.wage=(costVals.wage||0)+(bd.wage||0);
    costVals.com=(costVals.com||0)+(bd.com||0)+(bd.com_sp||0);
    costVals.staff=(costVals.staff||0)+(bd.staff||0);
    costVals.rent=(costVals.rent||0)+(bd.rent||0);
    costVals.elec=(costVals.elec||0)+(bd.elec||0);
    costVals.other_sum=(costVals.other_sum||0)+(bd.prop_tax||0)+(bd.water||0)+(bd.transfer||0)+(bd.net_fee||0)+(bd.phone||0)+(bd.common||0)+(bd.ice||0)+(bd.outside||0)+(bd.sign||0)+(bd.delivery||0)+(bd.other||0);
  });
  var dLabels=[], dData=[], dColors=['#f97316','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#94a3b8'];
  costKeys.forEach(function(pair){var v=costVals[pair[0]]||0; if(v>0){dLabels.push(pair[1]);dData.push(Math.round(v));}});
  if(chartCost) chartCost.destroy();
  chartCost=new Chart(document.getElementById('costChart'),{
    type:'doughnut',
    data:{labels:dLabels,datasets:[{data:dData,backgroundColor:dColors.slice(0,dData.length),borderWidth:2}]},
    options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:11}}}}}
  });
  
  // P&L table
  var cols=['บูธ','ยอดขาย','ส่วนลด','คงเหลือ','ต้นทุนขนม','กำไรขั้นต้น','ค่าแรง','ค่าคอม','พนักงาน','ค่าเช่า','ค่าไฟ','ค่าใช้จ่ายอื่น','กำไรสุทธิ'];
  var thead='<tr>'+cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
  var tbody=booths.map(function(b){
    var bd=d[b];
    var otherSum=(bd.prop_tax||0)+(bd.water||0)+(bd.transfer||0)+(bd.net_fee||0)+(bd.phone||0)+(bd.common||0)+(bd.ice||0)+(bd.outside||0)+(bd.sign||0)+(bd.delivery||0)+(bd.other||0);
    var np=bd.net_profit||0;
    var npClass=np>=0?'pos':'neg';
    return '<tr>'
      +'<td style="font-weight:700;color:#1e293b">'+b+'</td>'
      +'<td style="text-align:right">฿'+fmt(bd.sale)+'</td>'
      +'<td style="text-align:right;color:#dc2626">-฿'+fmt(bd.disc)+'</td>'
      +'<td style="text-align:right">฿'+fmt(bd.net_sale)+'</td>'
      +'<td style="text-align:right;color:#7c3aed">฿'+fmt(bd.cogs)+'</td>'
      +'<td style="text-align:right;color:#2563eb;font-weight:700">฿'+fmt(bd.gross)+'</td>'
      +'<td style="text-align:right">฿'+fmt(bd.wage)+'</td>'
      +'<td style="text-align:right">฿'+fmt((bd.com||0)+(bd.com_sp||0))+'</td>'
      +'<td style="text-align:right">฿'+fmt(bd.staff)+'</td>'
      +'<td style="text-align:right">฿'+fmt(bd.rent)+'</td>'
      +'<td style="text-align:right">฿'+fmt(bd.elec)+'</td>'
      +'<td style="text-align:right">฿'+fmt(otherSum)+'</td>'
      +'<td style="text-align:right" class="'+npClass+'">฿'+fmt(np)+'</td>'
      +'</tr>';
  }).join('');
  // Total row
  var totOther=0;
  var totWage=0,totCom=0,totStaff=0,totRent=0,totElec=0;
  booths.forEach(function(b){var bd=d[b];totWage+=bd.wage||0;totCom+=(bd.com||0)+(bd.com_sp||0);totStaff+=bd.staff||0;totRent+=bd.rent||0;totElec+=bd.elec||0;totOther+=(bd.prop_tax||0)+(bd.water||0)+(bd.transfer||0)+(bd.net_fee||0)+(bd.phone||0)+(bd.common||0)+(bd.ice||0)+(bd.outside||0)+(bd.sign||0)+(bd.delivery||0)+(bd.other||0);});
  tbody+='<tr style="background:#1e293b;color:#fff;font-weight:800">'
    +'<td>รวมทั้งหมด</td>'
    +'<td style="text-align:right">฿'+fmt(totSale)+'</td>'
    +'<td style="text-align:right;color:#fca5a5">-฿'+fmt(totDisc)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totSale-totDisc)+'</td>'
    +'<td style="text-align:right;color:#c4b5fd">฿'+fmt(totCogs)+'</td>'
    +'<td style="text-align:right;color:#93c5fd;font-weight:800">฿'+fmt(totGross)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totWage)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totCom)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totStaff)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totRent)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totElec)+'</td>'
    +'<td style="text-align:right">฿'+fmt(totOther)+'</td>'
    +'<td style="text-align:right;color:'+(totNet>=0?'#86efac':'#fca5a5')+'">฿'+fmt(totNet)+'</td>'
    +'</tr>';
  
  document.getElementById('costTable').innerHTML=
    '<div class="section-title">📋 รายละเอียดต้นทุนแต่ละบูธ</div>'
    +'<div style="overflow-x:auto"><table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
  
  // Trend chart
  renderTrend(yr);
}

function renderTrend(selYr){
  var tLabels=[], tProfit=[], tSale=[];
  var years=Object.keys(COST_DATA).map(Number).sort();
  years.forEach(function(y){
    var months=Object.keys(COST_DATA[y]).map(Number).sort();
    months.forEach(function(m){
      var d=COST_DATA[y][m], booths=Object.keys(d);
      var tot=booths.reduce(function(s,b){return s+(d[b].net_profit||0);},0);
      var sale=booths.reduce(function(s,b){return s+(d[b].sale||0);},0);
      tLabels.push(MONTH_TH[m]+' '+y);
      tProfit.push(Math.round(tot));
      tSale.push(Math.round(sale));
    });
  });
  if(chartTrend) chartTrend.destroy();
  chartTrend=new Chart(document.getElementById('trendChart'),{
    type:'bar',
    data:{labels:tLabels,datasets:[
      {type:'line',label:'กำไรสุทธิ',data:tProfit,borderColor:'#f97316',backgroundColor:'rgba(249,115,22,.1)',tension:.3,yAxisID:'y'},
      {label:'ยอดขาย',data:tSale,backgroundColor:'rgba(59,130,246,.3)',yAxisID:'y2',borderRadius:4}
    ]},
    options:{responsive:true,plugins:{legend:{position:'top'}},scales:{
      y:{ticks:{callback:function(v){return v.toLocaleString();}}},
      y2:{position:'right',ticks:{callback:function(v){return v.toLocaleString();}},grid:{drawOnChartArea:false}}
    }}
  });
}

initSelectors();
renderCost();
</script>
